[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfnn-reproduction"
version = "1.0.0"
description = "Code and reproducibility artifacts for continued fraction neural networks in sharp scientific response modelling."
requires-python = ">=3.12"
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
